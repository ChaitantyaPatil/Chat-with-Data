[project]
name = "chat-with-data"
version = "1.0.0"
description = "AI-powered data analysis application — upload CSV/Excel and chat with your data using natural language."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.57.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.1.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "kaleido>=0.4.0",
    "pytest>=8.0.0",
]

[project.scripts]
start = "streamlit run app/main.py"
